services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: motranscript
      MYSQL_USER: motranscript
      MYSQL_PASSWORD: motranscript
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umotranscript", "-pmotranscript"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
