[project]
name = "motranscript"
version = "0.1.0"
description = "Mauritian Creole ASR annotation and training flywheel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.115.0",
    "faster-whisper>=1.1.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.6.0",
    "pymysql>=1.1.0",
    "python-multipart>=0.0.17",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "yt-dlp>=2024.12.0",
]

[project.optional-dependencies]
pipeline = [
    "pyannote.audio>=3.3.0,<4.0.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "whisperx>=3.1.0",
]
training = [
    "accelerate>=1.2.0",
    "ctranslate2>=4.5.0",
    "datasets>=3.2.0",
    "evaluate>=0.4.3",
    "huggingface-hub>=0.27.0",
    "jiwer>=3.0.5",
    "librosa>=0.10.2",
    "peft>=0.14.0",
    "runpod>=1.7.0",
    "soundfile>=0.12.1",
    "transformers>=4.47.0",
]
dev = [
    "pymupdf>=1.24.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
motranscript-api = "apps.annotator.api.main:run"
motranscript-worker = "apps.annotator.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "normalizer", "training"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
